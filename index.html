<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>简记 · 温馨笔记</title>
<style>
:root{
  --bg:#f6f4f1; --card:#ffffff; --primary:#e07a5f; --primary-soft:#fdf0eb;
  --text:#3d3a37; --muted:#a09b94; --border:#ece7e1; --shadow:0 1px 3px rgba(61,58,55,.06);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
.hidden{display:none!important}
.app{display:flex;height:100vh;max-width:1400px;margin:0 auto}

/* ===== 左栏 ===== */
.sidebar{width:230px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700}
.logo .sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;margin-left:2px}
.logo .sync-dot.ok{background:#4caf7d}
.logo .sync-dot.sync{background:#f0b429;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.sync-status{font-size:11px;color:var(--muted);margin-top:4px}
.sb-section{padding:10px 8px;border-bottom:1px solid var(--border)}
.sb-title{font-size:11px;color:var(--muted);padding:0 8px 6px;display:flex;justify-content:space-between;align-items:center}
.sb-title button{border:none;background:none;color:var(--muted);font-size:15px;padding:0 4px}
.nb-item{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;border:none;background:none;border-radius:8px;font-size:13.5px;color:var(--text);text-align:left;transition:background .15s}
.nb-item:hover{background:var(--bg)}
.nb-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nb-item .cnt{font-size:11px;color:var(--muted);margin-left:auto}
.nb-item .del{display:none;border:none;background:none;color:var(--muted);font-size:13px;padding:0 2px}
.nb-item:hover .del{display:block}
.tag-item{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;margin:3px 4px 3px 0;border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .15s}
.tag-item.on{background:var(--primary);border-color:var(--primary);color:#fff}
.sb-foot{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;margin-top:auto}
.sb-foot button{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;color:var(--text)}

/* ===== 中栏 ===== */
.middle{width:300px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.md-head{display:flex;gap:8px;padding:14px}
.md-head input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;outline:none;background:#fff}
.md-head input:focus{border-color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.btn-primary:hover{opacity:.9}
.note-list{flex:1;overflow-y:auto;padding:0 10px 20px}
.note-card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;box-shadow:var(--shadow);transition:all .15s}
.note-card:hover{border-color:var(--border)}
.note-card.active{border-color:var(--primary);background:var(--primary-soft)}
.note-card .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px;overflow:hidden}
.note-card .t .pin{font-size:11px;flex-shrink:0}
.note-card .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-card .s{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-card .meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:#b8b2ab}
.note-card .meta .nb-tag{background:var(--primary-soft);color:var(--primary);padding:1px 7px;border-radius:10px}
.empty-hint{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px;line-height:2}
.empty-hint .big{font-size:40px;display:block;margin-bottom:8px}

/* ===== 编辑器 ===== */
.editor{flex:1;background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.ed-topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border)}
.ed-topbar .back{display:none;border:none;background:none;font-size:18px;color:var(--muted)}
.ed-topbar input{flex:1;border:none;outline:none;font-size:18px;font-weight:600;color:var(--text)}
.ed-topbar .icon-btn{border:none;background:none;font-size:15px;color:var(--muted);padding:4px 7px;border-radius:7px}
.ed-topbar .icon-btn:hover{background:var(--bg)}
#wordCount{font-size:11px;color:var(--muted);white-space:nowrap}
.format-bar{display:flex;align-items:center;gap:3px;padding:6px 16px;border-bottom:1px solid var(--border);background:var(--bg);flex-wrap:wrap}
.fb{border:none;background:transparent;padding:4px 10px;border-radius:7px;font-size:13px;color:var(--text);transition:background .15s}
.fb:hover{background:#e8e4df}
.fb-sep{width:1px;height:16px;background:var(--border);margin:0 3px}
.content-area{flex:1;overflow-y:auto;padding:20px 28px 40px}
.editor-area{outline:none;font-size:15px;line-height:1.9;color:var(--text);min-height:100%;word-break:break-word}
.editor-area:empty::before{content:attr(data-placeholder);color:#c9c4bd;pointer-events:none}
.ed-foot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--border);background:var(--bg);font-size:12px;color:var(--muted)}
.ed-foot .tag-edit{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:1}
.ed-foot .chip{background:#fff;border:1px solid var(--border);border-radius:12px;padding:2px 9px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
.ed-foot .chip .x{border:none;background:none;color:var(--muted);font-size:12px;padding:0 2px}
#saveStatus{margin-left:auto;white-space:nowrap}

/* ===== 弹窗 ===== */
.mask{position:fixed;inset:0;background:rgba(40,35,32,.4);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.open{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:16px;padding:22px 24px;width:400px;max-width:92vw;box-shadow:0 12px 48px rgba(0,0,0,.2);transform:scale(.96);transition:transform .2s}
.mask.open .modal{transform:scale(1)}
.modal h3{font-size:16px;margin-bottom:14px}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.modal .field input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;outline:none}
.modal .field input:focus{border-color:var(--primary)}
.modal .hint{font-size:11.5px;color:var(--muted);line-height:1.7;background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px 14px;font-size:13px}

/* ===== AI 悬浮 + 指令框 ===== */
.ai-fab{position:fixed;right:20px;bottom:20px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#e07a5f,#c0563f);color:#fff;font-size:23px;border:none;box-shadow:0 6px 20px rgba(224,122,95,.4);z-index:90;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;transition:transform .15s}
.ai-fab:active{cursor:grabbing}
.ai-fab.hidden{opacity:0;pointer-events:none}
.ai-command{position:fixed;z-index:110;display:flex;align-items:center;gap:4px;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:5px 6px;border:1px solid var(--border)}
.ai-command input{border:none;outline:none;font-size:13px;width:250px;padding:4px 8px}
.ai-command button{border:none;background:var(--primary);color:#fff;border-radius:7px;padding:5px 11px;font-size:13px}
.ai-drawer{position:fixed;right:20px;bottom:88px;width:350px;max-width:calc(100vw - 32px);max-height:70vh;z-index:95;background:#fff;border-radius:16px;box-shadow:0 12px 44px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(16px) scale(.97);transition:all .22s}
.ai-drawer.open{opacity:1;pointer-events:auto;transform:none}
.ai-head{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--border);cursor:grab;user-select:none}
.ai-head:active{cursor:grabbing}
.ai-head .t{font-size:14px;font-weight:700}
.ai-body{flex:1;overflow-y:auto;padding:12px 15px;display:flex;flex-direction:column;gap:10px}
.ai-modes{display:flex;flex-wrap:wrap;gap:5px}
.ai-modes button{border:1px solid var(--border);background:#fff;border-radius:16px;padding:4px 12px;font-size:12px;color:var(--text)}
.ai-modes button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.ai-result{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;min-height:60px;max-height:240px;overflow-y:auto;white-space:pre-wrap;line-height:1.7}
.ai-result .err{color:#d64545}
.ai-actions{display:flex;gap:8px}
.ai-actions button{flex:1;padding:7px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:12.5px}

/* ===== 移动端 ===== */
@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:80;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .middle{width:100%}
  .editor{position:fixed;inset:0;z-index:70;transform:translateX(100%);transition:transform .25s}
  .editor.open{transform:translateX(0)}
  .ed-topbar .back{display:block}
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#d8d2ca;border-radius:3px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="logo">📝 简记 <span class="sync-dot" id="syncDot"></span></div>
      <div class="sync-status" id="syncStatus">本地模式</div>
    </div>
    <div class="sb-section">
      <button class="nb-item active" data-nb="all">📚 全部笔记 <span class="cnt" id="cntAll"></span></button>
      <button class="nb-item" data-nb="trash">🗑️ 回收站 <span class="cnt" id="cntTrash"></span></button>
    </div>
    <div class="sb-section">
      <div class="sb-title">笔记本 <button id="addNb" title="新建笔记本">＋</button></div>
      <div id="nbList"></div>
    </div>
    <div class="sb-section">
      <div class="sb-title">标签</div>
      <div id="tagList"></div>
    </div>
    <div class="sb-foot">
      <button id="syncNow" title="立即同步到 GitHub">🔄 同步</button>
      <button id="menuBtn" title="菜单">☰</button>
    </div>
  </aside>

  <div class="middle" id="middle">
    <div class="md-head">
      <input id="search" placeholder="🔍 搜索笔记…">
      <button class="btn-primary" id="newNote">＋ 新建</button>
    </div>
    <div class="note-list" id="noteList"></div>
  </div>

  <main class="editor" id="editor">
    <div class="ed-topbar">
      <button class="back" id="backBtn">←</button>
      <input id="titleInput" placeholder="标题">
      <span id="wordCount"></span>
      <button class="icon-btn" id="pinBtn" title="置顶">📌</button>
      <button class="icon-btn" id="aiBtn" title="AI 助手">✨</button>
      <button class="icon-btn" id="exportBtn" title="导出为网页">⤓</button>
      <button class="icon-btn" id="delBtn" title="删除">🗑</button>
    </div>
    <div class="format-bar" id="formatBar">
      <button class="fb" data-cmd="bold" title="加粗 Ctrl+B"><b>B</b></button>
      <button class="fb" data-cmd="italic" title="斜体 Ctrl+I"><i>I</i></button>
      <button class="fb" data-cmd="underline" title="下划线 Ctrl+U"><u>U</u></button>
      <span class="fb-sep"></span>
      <button class="fb" data-cmd="foreColor" data-val="#e5484d" title="红色">红</button>
      <button class="fb" data-cmd="foreColor" data-val="#1d4ed8" title="蓝色">蓝</button>
      <button class="fb" data-cmd="foreColor" data-val="#10b981" title="绿色">绿</button>
      <button class="fb" data-cmd="foreColor" data-val="#e07a5f" title="橙色">橙</button>
      <button class="fb" data-cmd="foreColor" data-val="#3d3a37" title="黑色">黑</button>
      <span class="fb-sep"></span>
      <button class="fb" data-cmd="fontSize" data-val="3" title="小字">A-</button>
      <button class="fb" data-cmd="fontSize" data-val="5" title="大字">A+</button>
      <span class="fb-sep"></span>
      <button class="fb" data-cmd="removeFormat" title="清除格式">🧹</button>
    </div>
    <div class="content-area">
      <div class="editor-area" id="contentInput" contenteditable="true" data-placeholder="开始记录这一刻的想法…"></div>
    </div>
    <div class="ed-foot">
      <div class="tag-edit" id="tagEditor"></div>
      <span id="saveStatus"></span>
    </div>
  </main>
</div>

<!-- 新建笔记本弹窗 -->
<div class="mask" id="nbMask"><div class="modal">
  <h3>新建笔记本</h3>
  <div class="field"><label>名称</label><input id="nbName" placeholder="如：读书笔记"></div>
  <div class="btns"><button class="btn-ghost" id="nbCancel">取消</button><button class="btn-primary" id="nbSave">创建</button></div>
</div></div>

<!-- 设置弹窗 -->
<div class="mask" id="setMask"><div class="modal">
  <h3>⚙️ 设置</h3>
  <div class="hint" id="setHint">同步需要 GitHub：数据存到你的私人仓库 notes-data，手机电脑自动互通。</div>
  <div class="field"><label>GitHub Token（同步用，仅存本机）</label><input id="cfgToken" type="password" placeholder="ghp_..."></div>
  <div class="field"><label>AI API Key（DeepSeek，仅存本机）</label><input id="cfgAikey" type="password" placeholder="sk-..."></div>
  <div class="btns"><button class="btn-ghost" id="setCancel">取消</button><button class="btn-primary" id="setSave">保存</button></div>
</div></div>

<!-- AI 悬浮球 -->
<button class="ai-fab" id="aiFab">✨</button>
<!-- AI 指令框 -->
<div class="ai-command hidden" id="aiCmd"><input id="aiCmdInput" placeholder="告诉 AI 做什么…（如：翻译成英文 / 变成红色）"><button id="aiCmdGo">▶</button></div>
<!-- AI 面板 -->
<div class="ai-drawer" id="aiDrawer">
  <div class="ai-head"><span class="t">✨ AI 助手</span><span style="flex:1"></span><button class="icon-btn" id="aiClose">✕</button></div>
  <div class="ai-body">
    <div class="ai-modes" id="aiModes">
      <button data-mode="continue" class="on">续写</button>
      <button data-mode="polish">润色</button>
      <button data-mode="summary">总结</button>
      <button data-mode="title">起标题</button>
      <button data-mode="classify">智能归类</button>
    </div>
    <div class="ai-result" id="aiResult">选一个功能，点「生成」</div>
    <div class="ai-actions">
      <button id="aiRun">生成</button>
      <button id="aiApply" disabled>应用</button>
      <button id="aiCopy" disabled>复制</button>
    </div>
  </div>
</div>

<script>
/* ===== 常量与工具 ===== */
const GH_USER = 'andy-0294', GH_REPO = 'notes-data', GH_FILE = 'notes.json';
const LS_DATA = 'jianji-data-v2', LS_CFG = 'jianji-config';
let data = { notebooks: [], notes: [] };
let currentId = null, currentNb = 'all', currentTag = null, searchKw = '';
let fileSha = null;  // GitHub 文件最新 sha
let saveTimer = null, syncTimer = null;
const $ = id => document.getElementById(id);
function uid(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function pad(n){ return n<10?'0'+n:''+n; }
function fmtTime(ts){
  const d=new Date(ts), now=new Date(), diff=now-d;
  if(diff<60000) return '刚刚';
  if(diff<3600000) return Math.floor(diff/60000)+' 分钟前';
  if(now.getDate()===d.getDate()) return '今天 '+pad(d.getHours())+':'+pad(d.getMinutes());
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stripHtml(h){ const d=document.createElement('div'); d.innerHTML=h||''; return d.textContent||''; }
function looksLikeHtml(s){ return /<[a-z][\s\S]*>/i.test(s); }
function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s){ return decodeURIComponent(escape(atob(s))); }
function cfg(){ try{ return JSON.parse(localStorage.getItem(LS_CFG))||{}; }catch(e){ return {}; } }
function saveCfg(c){ localStorage.setItem(LS_CFG, JSON.stringify(c)); }
function getNote(id){ return data.notes.find(n=>n.id===id); }
function notebookName(id){ const nb=data.notebooks.find(x=>x.id===id); return nb?nb.name:'未分类'; }

/* ===== 数据持久化 ===== */
function loadData(){ try{ data = JSON.parse(localStorage.getItem(LS_DATA)) || { notebooks:[], notes:[] }; }catch(e){ data={notebooks:[],notes:[]}; } }
function saveData(){ data.updatedAt = Date.now(); localStorage.setItem(LS_DATA, JSON.stringify(data)); }

/* ===== GitHub 同步 ===== */
async function ghApi(path, opts){
  const c = cfg();
  if(!c.token) throw new Error('NO_TOKEN');
  const resp = await fetch('https://api.github.com' + path, Object.assign({
    headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'Content-Type':'application/json' }
  }, opts));
  if(resp.status === 401) throw new Error('TOKEN_INVALID');
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}
function setSync(status, txt){
  const dot = $('syncDot'), st = $('syncStatus');
  dot.className = 'sync-dot' + (status==='ok'?' ok':status==='sync'?' sync':'');
  if(txt !== undefined) st.textContent = txt;
}
async function syncPull(){
  const c = cfg();
  if(!c.token){ setSync('', '未配置同步'); return; }
  setSync('sync', '同步中…');
  try{
    const r = await ghApi('/repos/'+GH_USER+'/'+GH_REPO+'/contents/'+GH_FILE);
    fileSha = r.sha;
    const remote = JSON.parse(b64decode(r.content));
    if(remote && remote.notes){
      data = mergeData(data, remote);
      saveData();
    }
    setSync('ok', '已同步');
    renderAll();
  }catch(e){
    if(e.message === 'HTTP 404'){ setSync('ok', '已同步（云端无数据）'); }
    else if(e.message === 'TOKEN_INVALID'){ setSync('', 'Token 无效'); }
    else setSync('', '同步失败');
  }
}
function mergeData(local, remote){
  // 以 remote 为基础，本地更新的覆盖
  const map = {};
  remote.notes.forEach(n => map[n.id] = n);
  local.notes.forEach(n => { if(!map[n.id] || (n.updatedAt||0) > (map[n.id].updatedAt||0)) map[n.id] = n; });
  const nbs = {};
  remote.notebooks.forEach(b => nbs[b.id]=b);
  local.notebooks.forEach(b => nbs[b.id]=b);
  return { notebooks: Object.values(nbs), notes: Object.values(map) };
}
async function syncPush(){
  const c = cfg();
  if(!c.token) return;
  setSync('sync', '同步中…');
  try{
    const body = {
      message: 'update ' + new Date().toLocaleString(),
      content: b64encode(JSON.stringify(data))
    };
    if(fileSha) body.sha = fileSha;
    const r = await ghApi('/repos/'+GH_USER+'/'+GH_REPO+'/contents/'+GH_FILE, {
      method: 'PUT', body: JSON.stringify(body)
    });
    fileSha = r.content && r.content.sha;
    setSync('ok', '已同步');
  }catch(e){
    if(e.message === 'HTTP 409'){ setSync('sync','冲突，重新拉取…'); await syncPull(); }
    else setSync('', '同步失败');
  }
}
function scheduleSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncPush, 2000);
}

/* ===== 渲染 ===== */
function renderAll(){ renderNotebooks(); renderTags(); renderNotes(); updateCounts(); }
function updateCounts(){
  $('cntAll').textContent = data.notes.filter(n=>!n.deleted).length;
  $('cntTrash').textContent = data.notes.filter(n=>n.deleted).length;
}
function renderNotebooks(){
  const el = $('nbList');
  el.innerHTML = data.notebooks.map(b =>
    '<div class="nb-item'+(currentNb===b.id?' active':'')+'" data-nb="'+b.id+'">📁 '+esc(b.name)+
    '<span class="cnt">'+data.notes.filter(n=>n.notebookId===b.id&&!n.deleted).length+'</span>'+
    '<button class="del" data-del="'+b.id+'">✕</button></div>').join('') ||
    '<div style="font-size:12px;color:var(--muted);padding:4px 10px">点击 ＋ 新建笔记本</div>';
}
function renderTags(){
  const tags = {};
  data.notes.filter(n=>!n.deleted).forEach(n => (n.tags||[]).forEach(t => { if(t) tags[t]=(tags[t]||0)+1; }));
  $('tagList').innerHTML = Object.keys(tags).map(t =>
    '<span class="tag-item'+(currentTag===t?' on':'')+'" data-tag="'+esc(t)+'">#'+esc(t)+'</span>').join('') ||
    '<div style="font-size:12px;color:var(--muted);padding:4px 10px">暂无标签</div>';
}
function renderNotes(){
  const el = $('noteList');
  let arr = data.notes.filter(n => currentNb==='trash' ? n.deleted : !n.deleted);
  if(currentNb !== 'all' && currentNb !== 'trash') arr = arr.filter(n => n.notebookId === currentNb);
  if(currentTag) arr = arr.filter(n => (n.tags||[]).includes(currentTag));
  if(searchKw){ const k=searchKw.toLowerCase(); arr = arr.filter(n => (n.title+' '+stripHtml(n.content)).toLowerCase().includes(k)); }
  arr.sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0) || (b.updatedAt||0)-(a.updatedAt||0));
  if(!arr.length){
    el.innerHTML = '<div class="empty-hint"><span class="big">'+(currentNb==='trash'?'🗑️':'📝')+'</span>'+
      (currentNb==='trash'?'回收站是空的':'还没有笔记，点右上角「＋ 新建」开始')+'</div>';
    return;
  }
  el.innerHTML = arr.map(n => {
    const sum = stripHtml(n.content).replace(/\s+/g,' ').trim().slice(0,50)||'（空）';
    const nb = currentNb==='all' ? '<span class="nb-tag">'+esc(notebookName(n.notebookId))+'</span>' : '';
    return '<div class="note-card'+(n.id===currentId?' active':'')+'" data-id="'+n.id+'">'+
      '<div class="t">'+(n.pinned?'<span class="pin">📌</span>':'')+'<span>'+esc(n.title||'无标题')+'</span></div>'+
      '<div class="s">'+esc(sum)+'</div>'+
      '<div class="meta">'+nb+'<span>'+fmtTime(n.updatedAt||n.createdAt)+'</span></div></div>';
  }).join('');
}
function renderEditor(){
  const n = getNote(currentId);
  if(!n) return;
  $('titleInput').value = n.title || '';
  $('contentInput').innerHTML = n.content ? (looksLikeHtml(n.content)?n.content:toPlainHtml(n.content)) : '';
  $('pinBtn').textContent = n.pinned ? '📌' : '📍';
  $('pinBtn').style.opacity = n.pinned ? '1' : '.4';
  renderTagEditor();
  updateWordCount();
}
function toPlainHtml(s){ return esc(s).replace(/\n/g,'<br>'); }
function renderTagEditor(){
  const n = getNote(currentId);
  const el = $('tagEditor');
  if(!n){ el.innerHTML=''; return; }
  el.innerHTML = (n.tags||[]).map(t => '<span class="chip">#'+esc(t)+'<button class="x" data-rt="'+esc(t)+'">✕</button></span>').join('') +
    '<span class="chip" style="cursor:pointer" id="addTagChip">＋ 标签</span>';
}
function updateWordCount(){
  const n = getNote(currentId);
  $('wordCount').textContent = n ? (stripHtml(n.content).replace(/\s/g,'').length + ' 字') : '';
}
function selectNote(id){
  currentId = id;
  renderNotes();
  renderEditor();
  $('editor').classList.add('open');
}
function openEditor(){ $('editor').classList.add('open'); }
function closeEditor(){ $('editor').classList.remove('open'); }

/* ===== 笔记操作 ===== */
function newNote(){
  const n = { id: uid(), title:'', content:'', notebookId: currentNb!=='all'&&currentNb!=='trash'?currentNb:'', tags:[], pinned:false, deleted:false, createdAt:Date.now(), updatedAt:Date.now() };
  data.notes.push(n); saveData(); scheduleSync();
  currentId = n.id;
  renderAll(); renderEditor(); openEditor();
  $('titleInput').focus();
}
function delNote(){
  const n = getNote(currentId);
  if(!n) return;
  if(n.deleted){ if(confirm('彻底删除这篇笔记？不可恢复')){ data.notes = data.notes.filter(x=>x.id!==currentId); currentId=null; } }
  else { n.deleted = true; n.deletedAt = Date.now(); currentId = null; }
  saveData(); scheduleSync(); renderAll(); closeEditor();
}
function restoreNote(id){ const n=getNote(id); if(n){ n.deleted=false; delete n.deletedAt; saveData(); scheduleSync(); renderAll(); } }
function togglePin(){ const n=getNote(currentId); if(n){ n.pinned=!n.pinned; saveData(); scheduleSync(); renderAll(); renderEditor(); } }
function newNotebook(){
  const name = $('nbName').value.trim();
  if(!name) return;
  data.notebooks.push({ id:'b'+uid(), name:name, createdAt:Date.now() });
  saveData(); scheduleSync(); renderAll(); $('nbMask').classList.remove('open'); $('nbName').value='';
}
function delNotebook(id){
  const b = data.notebooks.find(x=>x.id===id);
  if(!b) return;
  if(confirm('删除笔记本「'+b.name+'」？笔记会移到「未分类」')){ data.notes.forEach(n=>{ if(n.notebookId===id) n.notebookId=''; }); data.notebooks=data.notebooks.filter(x=>x.id!==id); saveData(); scheduleSync(); renderAll(); }
}

/* ===== 富文本编辑 ===== */
function execFmt(cmd, val){
  $('contentInput').focus();
  document.execCommand(cmd, false, val);
  scheduleSave();
}
function scheduleSave(){
  const n = getNote(currentId);
  if(!n) return;
  $('saveStatus').textContent = '编辑中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    n.title = $('titleInput').value;
    n.content = $('contentInput').innerHTML;
    n.updatedAt = Date.now();
    saveData(); scheduleSync();
    $('saveStatus').textContent = '已保存 ' + new Date().toTimeString().slice(0,5);
    renderNotes(); renderTags(); updateCounts(); updateWordCount();
  }, 600);
}

/* ===== AI ===== */
function aiPrompt(mode, text){
  switch(mode){
    case 'continue': return [{role:'system',content:'你是笔记写作助手，自然地续写用户内容，保持风格，只输出续写内容。'},{role:'user',content:text}];
    case 'polish': return [{role:'system',content:'你是润色助手，修正错别字和语病，使表达通顺精炼，保持原意，直接输出润色后的文本。'},{role:'user',content:text}];
    case 'summary': return [{role:'system',content:'用简洁中文要点总结用户内容，不超过5条，每条一行，以"- "开头。'},{role:'user',content:text}];
    case 'title': return [{role:'system',content:'根据用户笔记内容，起一个简洁贴切的标题（10字以内），只输出标题本身。'},{role:'user',content:text}];
    case 'classify': {
      const nbs = data.notebooks.map(b=>b.name).join('、')||'未分类';
      return [{role:'system',content:'你是笔记分类助手。根据笔记内容，输出 JSON：{"notebook":"建议的笔记本名（从给定列表选，没有就空字符串）","tags":["标签1","标签2"]}。笔记本列表：'+nbs},{role:'user',content:text}];
    }
  }
}
async function aiRun(){
  const c = cfg();
  if(!c.aikey){ $('aiResult').innerHTML = '<span class="err">请先在 ⚙️ 设置里填 AI Key</span>'; openSettings(); return; }
  const n = getNote(currentId);
  if(!n){ $('aiResult').innerHTML = '<span class="err">请先打开一篇笔记</span>'; return; }
  const text = stripHtml(n.content) || $('contentInput').innerText || '';
  if(aiMode !== 'title' && !text.trim()){ $('aiResult').innerHTML = '<span class="err">笔记是空的</span>'; return; }
  const el = $('aiResult');
  el.innerHTML = '思考中…（最多25秒）';
  $('aiRun').disabled = true;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 25000);
  try{
    const resp = await fetch('https://api.deepseek.com/chat/completions', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.aikey},
      body: JSON.stringify({model:'deepseek-v4-flash', messages:aiPrompt(aiMode, text), temperature:0.7, max_tokens:2000, thinking:{type:'disabled'}}),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const d = await resp.json();
    const result = (d.choices && d.choices[0].message.content||'').trim();
    aiResultText = result;
    el.innerHTML = esc(result) || '<span class="err">（空结果）</span>';
    if(aiMode === 'title' && result){
      $('titleInput').value = result; scheduleSave();
      el.innerHTML = '✅ 已设为标题：' + esc(result);
    }
    $('aiApply').disabled = !result;
    $('aiCopy').disabled = !result;
  }catch(e){
    clearTimeout(timer);
    el.innerHTML = '<span class="err">失败：' + esc(e.message) + '</span>';
  }
  $('aiRun').disabled = false;
}
function aiApply(){
  if(!aiResultText) return;
  if(aiMode === 'classify'){
    try{
      const r = JSON.parse(aiResultText);
      const n = getNote(currentId);
      if(n){
        if(r.notebook){
          let nb = data.notebooks.find(b=>b.name===r.notebook);
          if(!nb){ nb={id:'b'+uid(),name:r.notebook,createdAt:Date.now()}; data.notebooks.push(nb); }
          n.notebookId = nb.id;
        }
        if(Array.isArray(r.tags)) n.tags = Array.from(new Set([...(n.tags||[]),...r.tags]));
        saveData(); scheduleSync(); renderAll(); renderEditor();
      }
      $('aiResult').innerHTML = '✅ 已应用分类';
      return;
    }catch(e){ /* fall through */ }
  }
  if(aiMode === 'summary' || aiMode === 'polish'){
    insertAI(esc(aiResultText).replace(/\n/g,'<br>'));
  } else {
    $('contentInput').focus();
    insertAI(esc(aiResultText).replace(/\n/g,'<br>'));
  }
  scheduleSave();
  $('aiApply').disabled = true; $('aiCopy').disabled = true;
}
function insertAI(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(el=>el.remove());
  const sel = window.getSelection();
  if(sel && !sel.isCollapsed && $('contentInput').contains(sel.anchorNode)){
    const range = sel.getRangeAt(0);
    const frag = document.createRange().createContextualFragment(tmp.innerHTML);
    range.deleteContents(); range.insertNode(frag);
  }else{
    while(tmp.firstChild) $('contentInput').appendChild(tmp.firstChild);
  }
}
function aiCopy(){ if(aiResultText){ navigator.clipboard.writeText(aiResultText).then(()=>{ $('aiCopy').textContent='已复制'; setTimeout(()=>$('aiCopy').textContent='复制',1200); }); } }

/* ===== 指令框（选中弹出） ===== */
const aiCmd = $('aiCmd'), aiCmdInput = $('aiCmdInput');
let aiCmdRange = null, lastDownTarget = null;
function restoreRange(r){ const s=window.getSelection(); s.removeAllRanges(); s.addRange(r); $('contentInput').focus(); }
function showAiCmd(rect){
  aiCmd.classList.remove('hidden');
  const w = aiCmd.offsetWidth||320, h = aiCmd.offsetHeight||40;
  const left = Math.max(4, Math.min(rect.left, window.innerWidth - w - 4));
  const below = rect.bottom + 8, above = rect.top - h - 8;
  const edTop = $('contentInput').getBoundingClientRect().top;
  let top = below + h <= window.innerHeight-4 ? below : (above > edTop+8 ? above : Math.max(4, window.innerHeight-h-4));
  aiCmd.style.left = left+'px'; aiCmd.style.top = top+'px';
  aiCmdInput.focus();
}
function hideAiCmd(){ aiCmd.classList.add('hidden'); aiCmdInput.value=''; aiCmdInput.disabled=false; aiCmdRange=null; }
function maybeShowCmd(){
  const s = window.getSelection();
  if(s && !s.isCollapsed && $('contentInput').contains(s.anchorNode) && $('contentInput').contains(s.focusNode)){
    aiCmdRange = s.getRangeAt(0);
    showAiCmd(s.getRangeAt(0).getBoundingClientRect());
  }
}
function cmdExec(){
  const cmd = aiCmdInput.value.trim();
  if(!cmd || !aiCmdRange) return;
  const range = aiCmdRange.cloneRange(), selText = range.toString();
  const fmtMap = [
    {re:/红色|变红/, cmd:'foreColor', val:'#e5484d'}, {re:/蓝色|变蓝/, cmd:'foreColor', val:'#1d4ed8'},
    {re:/绿色|变绿/, cmd:'foreColor', val:'#10b981'}, {re:/橙色|变橙/, cmd:'foreColor', val:'#e07a5f'},
    {re:/黑色|变黑/, cmd:'foreColor', val:'#3d3a37'}, {re:/加粗|粗体/, cmd:'bold'},
    {re:/斜体/, cmd:'italic'}, {re:/下划线/, cmd:'underline'},
    {re:/大一点|放大|变大/, cmd:'fontSize', val:'5'}, {re:/小一点|缩小|变小/, cmd:'fontSize', val:'3'},
    {re:/清除格式|去格式/, cmd:'removeFormat'}
  ];
  for(const f of fmtMap){ if(f.re.test(cmd)){ restoreRange(range); execFmt(f.cmd, f.val); hideAiCmd(); return; } }
  aiCmdInput.disabled = true; aiCmdInput.value = 'AI 处理中…';
  const c = cfg();
  if(!c.aikey){ hideAiCmd(); openSettings(); return; }
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 25000);
  fetch('https://api.deepseek.com/chat/completions', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.aikey},
    body: JSON.stringify({model:'deepseek-v4-flash', messages:[
      {role:'system',content:'你是笔记编辑助手。按用户指令处理选中文字，只输出结果，不要解释、不要引号。'},
      {role:'user',content:'选中内容：\n'+selText+'\n\n指令：'+cmd}
    ], temperature:0.7, max_tokens:2000, thinking:{type:'disabled'}}),
    signal: ctrl.signal
  }).then(r=>r.json()).then(d=>{
    const result = (d.choices && d.choices[0].message.content||'').trim();
    if(result){ restoreRange(range); const frag=document.createRange().createContextualFragment(esc(result).replace(/\n/g,'<br>')); range.deleteContents(); range.insertNode(frag); scheduleSave(); }
    hideAiCmd();
  }).catch(()=>{ hideAiCmd(); }).finally(()=>clearTimeout(timer));
}

/* ===== 设置 ===== */
function openSettings(){
  const c = cfg();
  $('cfgToken').value = c.token || '';
  $('cfgAikey').value = c.aikey || '';
  $('setMask').classList.add('open');
}

/* ===== 导出 ===== */
function exportNote(){
  const n = getNote(currentId);
  if(!n) return;
  const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>'+esc(n.title||'笔记')+'</title>'+
    '<style>body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;max-width:760px;margin:40px auto;padding:0 24px;line-height:2;color:#3d3a37}h1{color:#e07a5f}</style></head><body>'+
    '<h1>'+esc(n.title||'无标题')+'</h1>'+(n.content||'')+'</body></html>';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download=(n.title||'笔记')+'.html'; a.click();
}

/* ===== 事件绑定 ===== */
$('newNote').addEventListener('click', newNote);
$('delBtn').addEventListener('click', delNote);
$('pinBtn').addEventListener('click', togglePin);
$('exportBtn').addEventListener('click', exportNote);
$('backBtn').addEventListener('click', closeEditor);
$('aiBtn').addEventListener('click', ()=>$('aiDrawer').classList.add('open'));
$('aiFab').addEventListener('click', ()=>{ $('aiDrawer').classList.add('open'); });
$('aiClose').addEventListener('click', ()=>$('aiDrawer').classList.remove('open'));
$('syncNow').addEventListener('click', ()=>{ if(cfg().token) syncPull(); else openSettings(); });
$('menuBtn').addEventListener('click', ()=>$('sidebar').classList.toggle('open'));
$('addNb').addEventListener('click', ()=>$('nbMask').classList.add('open'));
$('nbCancel').addEventListener('click', ()=>$('nbMask').classList.remove('open'));
$('nbSave').addEventListener('click', newNotebook);
$('setCancel').addEventListener('click', ()=>$('setMask').classList.remove('open'));
$('setSave').addEventListener('click', ()=>{
  saveCfg({ token: $('cfgToken').value.trim(), aikey: $('cfgAikey').value.trim() });
  $('setMask').classList.remove('open');
  if(cfg().token){ syncPull(); }
});
$('search').addEventListener('input', function(){ searchKw=this.value.trim(); renderNotes(); });
$('titleInput').addEventListener('input', scheduleSave);
$('contentInput').addEventListener('input', scheduleSave);
$('formatBar').addEventListener('click', function(e){
  const b = e.target.closest('.fb'); if(!b) return;
  const cmd=b.dataset.cmd;
  if(cmd==='foreColor') execFmt('foreColor', b.dataset.val);
  else if(cmd==='fontSize') execFmt('fontSize', b.dataset.val);
  else execFmt(cmd);
});
$('contentInput').addEventListener('keydown', function(e){
  if(e.key==='Tab'){ e.preventDefault(); document.execCommand('insertText',false,'    '); scheduleSave(); return; }
  if(!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if(k==='b'){ e.preventDefault(); execFmt('bold'); }
  else if(k==='i'){ e.preventDefault(); execFmt('italic'); }
  else if(k==='u'){ e.preventDefault(); execFmt('underline'); }
});
/* 导航 */
document.addEventListener('click', function(e){
  const nb = e.target.closest('.nb-item'); 
  if(nb){
    if(nb.dataset.del) return;
    currentNb = nb.dataset.nb; currentTag=null;
    document.querySelectorAll('.nb-item').forEach(x=>x.classList.toggle('active', x===nb));
    renderNotes();
    return;
  }
  const del = e.target.closest('[data-del]');
  if(del){ delNotebook(del.dataset.del); return; }
  const card = e.target.closest('.note-card');
  if(card){
    const n = getNote(card.dataset.id);
    if(n && n.deleted){ /* 回收站里点卡片 → 提示恢复或彻底删 */ if(confirm('恢复这篇笔记？')) restoreNote(n.id); }
    else selectNote(card.dataset.id);
    return;
  }
  const tag = e.target.closest('.tag-item');
  if(tag){ currentTag = tag.dataset.tag==='__none__'?null:tag.dataset.tag; renderTags(); renderNotes(); return; }
  const rt = e.target.closest('[data-rt]');
  if(rt){ const n=getNote(currentId); if(n){ n.tags=n.tags.filter(t=>t!==rt.dataset.rt); saveData(); scheduleSync(); renderEditor(); renderTags(); } return; }
  if(e.target.id==='addTagChip'){ const t=prompt('输入标签名'); if(t&&t.trim()){ const n=getNote(currentId); n.tags=Array.from(new Set([...(n.tags||[]),t.trim()])); saveData(); scheduleSync(); renderEditor(); renderTags(); } }
});
/* AI 指令框 */
document.addEventListener('mousedown', function(e){ lastDownTarget = e.target; if(!aiCmd.classList.contains('hidden') && !aiCmd.contains(e.target)) hideAiCmd(); });
document.addEventListener('mouseup', function(e){
  if(lastDownTarget && lastDownTarget.closest && lastDownTarget.closest('.fb,.icon-btn,.btn-primary,.ai-fab,.ai-command,.mask')) return;
  maybeShowCmd();
});
$('contentInput').addEventListener('keyup', function(e){ if(e.key==='Escape') hideAiCmd(); else if(e.shiftKey||e.key.indexOf('Arrow')===0) maybeShowCmd(); });
aiCmdInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); cmdExec(); } if(e.key==='Escape') hideAiCmd(); });
$('aiCmdGo').addEventListener('click', cmdExec);
/* AI 面板 */
let aiMode='continue', aiResultText='';
$('aiModes').addEventListener('click', function(e){
  const b=e.target.closest('button'); if(!b) return;
  aiMode=b.dataset.mode;
  Array.prototype.forEach.call(this.children, x=>x.classList.toggle('on', x===b));
});
$('aiRun').addEventListener('click', aiRun);
$('aiApply').addEventListener('click', aiApply);
$('aiCopy').addEventListener('click', aiCopy);
/* AI 悬浮球拖拽 */
(function(){
  const fab=$('aiFab'); let drag=null, moved=false, suppress=false;
  fab.addEventListener('pointerdown', function(e){ drag={x:e.clientX,y:e.clientY,l:fab.offsetLeft,t:fab.offsetTop}; moved=false; try{fab.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
  fab.addEventListener('pointermove', function(e){ if(!drag) return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true; if(!moved) return; const nl=Math.max(0,Math.min(drag.l+dx,window.innerWidth-54)),nt=Math.max(0,Math.min(drag.t+dy,window.innerHeight-54)); fab.style.left=nl+'px'; fab.style.top=nt+'px'; fab.style.right='auto'; fab.style.bottom='auto'; });
  fab.addEventListener('pointerup', function(){ if(drag&&moved) suppress=true; drag=null; });
  fab.addEventListener('click', function(e){ if(suppress){ suppress=false; e.stopPropagation(); return; } $('aiDrawer').classList.add('open'); });
})();
/* 移动端遮罩 */
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ $('aiDrawer').classList.remove('open'); $('setMask').classList.remove('open'); $('nbMask').classList.remove('open'); } });

/* ===== 初始化 ===== */
loadData();
renderAll();
if(!data.notes.length){ /* 空数据欢迎引导 */ }
const c0 = cfg();
if(c0.token){ fileSha = null; syncPull(); }
else { setSync('', '点击 ☰ → 同步 配置'); }

</script>
